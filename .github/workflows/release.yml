# Po pushnutí tagu vX.Y.Z sestaví elvisek.zip (šablona) + elvisek-core.zip (plugin) a vytvoří GitHub Release.
# WordPress (inc/updater.php) si pak aktualizaci najde sám.
name: Release šablony

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Kontrola verze (tag = Version šablony i pluginu)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          THEME=$(grep -m1 -E '^Version:' theme/elvisek/style.css | awk '{print $2}')
          CORE=$(grep -m1 -E '^ \* Version:' plugins/elvisek-core/elvisek-core.php | awk '{print $3}')
          echo "tag=$TAG theme=$THEME core=$CORE"
          if [ "$TAG" != "$THEME" ] || [ "$TAG" != "$CORE" ]; then
            echo "::error::Tag v$TAG musí odpovídat Version ve style.css ($THEME) i v elvisek-core.php ($CORE)"; exit 1
          fi

      - name: Kontrola syntaxe PHP
        run: find theme/elvisek plugins/elvisek-core -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Sestavení ZIPů
        run: |
          (cd theme && zip -rq ../elvisek.zip elvisek -x 'elvisek/.gitkeep' -x '*/.DS_Store' -x 'elvisek/README.md')
          (cd plugins && zip -rq ../elvisek-core.zip elvisek-core -x '*/.DS_Store')
          unzip -l elvisek.zip | tail -1; unzip -l elvisek-core.zip | tail -1

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            elvisek.zip
            elvisek-core.zip
          generate_release_notes: true
